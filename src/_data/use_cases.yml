- id: flightcrew
  label: "Flight crew"
  eyebrow: "Airline crew scheduling"
  title: "10 flight legs. 24 crew. 42 required seats. Rotations that respect rest."
  intro: "Crew scheduling fills every required cockpit and cabin seat while qualification, overlap, connection continuity, availability, and every rest and recovery window hold at the same time."
  repo_url: "https://github.com/SolverForge/solverforge-usecases/tree/main/uc-flightcrew"
  icon: "fa-solid fa-plane"
  teaser_metric: "10 legs / 24 crew / 42 seats"
  teaser_copy: "Qualification, connectivity, availability, and rest and recovery rules solved as one rotation."
  metrics:
    - ["10", "Flight legs"]
    - ["24", "Crew"]
    - ["42", "Required seats"]
    - ["12", "Constraints"]
    - ["10 / 2", "Hard / soft split"]
    - ["6", "Airports"]
  body:
    - "A valid rotation is more than a name in a seat. Every seat needs a qualified crew member, no two duties may overlap, connected flights must be operated in sequence, and each person has to be available. Rest is where it gets hard: home-base and away-base minimums, 36-hour extended recovery, and 48-hour recovery after long-haul duty all hold together."
    - "Solve those rules one at a time and you get a roster that looks fine in one view and strands a crew member in another. The app keeps the crew timeline, the by-flight manifests, score analysis, the data tables, and the retained job in one model."
  constraints:
    - ["Seat coverage", "Every required cockpit and cabin seat is assigned."]
    - ["Qualification", "Pilot and cabin seats require the matching skill."]
    - ["Overlap prevention", "No crew member holds two duties that overlap in time."]
    - ["Connection continuity", "Connected consecutive flights are operated in sequence."]
    - ["Rest and recovery", "Home and away minimums, 36-hour extended recovery, and 48-hour long-haul recovery."]
    - ["Soft preference", "The first departure and last return prefer each crew member's home base."]
