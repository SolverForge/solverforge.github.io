    - ["30 s", "Search budget"]
  body:
    - "An electric delivery route is only valid if the van can actually drive it. A route that fits capacity and every delivery window can still run below the battery reserve halfway through, and adding a charging stop moves every later arrival. Visit order, charging, and lateness have to be decided together."
    - "Charging stops are derived rather than searched: after every route change an exact dynamic program places the stops that minimise range shortfall and then added time, so the list variable holds only pharmacies and the stock Clarke-Wright and k-opt construction works unchanged. The app keeps the route map, the van cards, the schedule, the input tables, score analysis, and the retained job on one surface."
  constraints:
    - ["Battery range", "No route runs below the van's reserve after its best charging plan."]
    - ["Van capacity", "Crates loaded stay within each van's capacity."]
    - ["Delivery windows", "Every delivery finishes before its window closes, charging delays included."]
    - ["Road reachability", "Every leg is connected on the OpenStreetMap road network."]
    - ["Travel time", "Driving, charger detours, and charging time stay a soft cost."]
    - ["Retained workflow", "Status, snapshots, score analysis, road geometry, and lifecycle actions stay on the stock contract."]
