      width: 1600
      height: 900
      badge: "Trip"
      alt: "The route pane beside the chat: a road map of Milan with numbered stops, 22 min and 14.6 km for four stops on a round trip, 7 min shorter than the order given."
      caption: "Four stops on Milan's roads: 22 min, 14.6 km, 7 min shorter than the order you gave."
