  eyebrow: "Electric-van delivery routing"
  title: "48 pharmacies. 6 electric vans. 14 chargers. One plan that never runs a battery flat."
  intro: "EV routing plans one delivery day around Bergamo: which van serves each pharmacy, in what order, and where it stops to charge, with capacity, delivery windows, real road travel, and battery range held together in one score."
  repo_url: "https://github.com/SolverForge/solverforge-usecases/tree/main/uc-ev"
  icon: "fa-solid fa-charging-station"
