- id: furnace
  label: "Furnace"
  eyebrow: "Industrial heat treatment"
  title: "155 heat-treatment orders. 11 furnaces. 39 operators. One coupled plan."
  intro: "Heat-treatment planning couples machine capacity, thermal sequencing, batch placement, task operators, monitoring load, and the shift roster into a single model, so a furnace plan that ignores operator coverage cannot look legal."
  repo_url: "https://github.com/SolverForge/solverforge-usecases/tree/main/uc-furnace"
  icon: "fa-solid fa-fire"
  teaser_metric: "155 orders / 11 furnaces / 39 operators"
  teaser_copy: "Furnace capacity, thermal sequencing, task operators, monitoring load, and shift rosters solved as one plan."
  metrics:
    - ["155", "Work orders"]
    - ["11", "Furnaces"]
    - ["39", "Operators"]
    - ["30", "Constraints"]
    - ["22 / 8", "Hard / soft split"]
    - ["7", "Days"]
  body:
    - "The answer is only valid if furnace assignment, time placement, task operators, monitoring capacity, and roster coverage all hold together. Staging those decisions can produce schedules that look legal in one layer and fail in another."
    - "The app keeps the furnace timeline, the operator roster, the order table, score analysis, the retained job, and the REST surface inspectable from one operating artifact."
  constraints:
    - ["Batch assignment", "Every work order is scheduled, and only on a compatible furnace."]
    - ["Furnace feasibility", "Process, temperature ceiling, and load capacity all have to hold."]
    - ["Sequencing", "Batches cannot overlap and must respect the thermal changeover gap."]
    - ["Task operators", "Load build, program, quench, and unload tasks need a skilled operator on the owning shift."]
    - ["Coverage and monitoring", "Role coverage and 15-minute monitoring capacity are solved with the same plan."]
    - ["Soft tradeoffs", "Priority-weighted lateness, thermal changeover, early starts, night starts, overtime, and load balance."]
