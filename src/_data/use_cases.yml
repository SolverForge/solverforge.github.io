- id: hermes-routing
  label: "SolverForge Routing"
  variant: product
  ribbon: "Hermes"
  eyebrow: "Built on SolverForge · Hermes Agent plugin"
  title: "Tell Hermes where you need to go. Get the order, on real roads."
  intro: "SolverForge Routing is a Hermes Agent plugin for personal multi-stop driving trips. Hermes finds the places, a SolverForge engine orders the stops on OpenStreetMap roads, and the road map opens beside the conversation."
  repo_url: "https://github.com/blackopsrepl/hermes-solverforge-routing"
  catalog_url: "https://hermes-agent.nousresearch.com/marketplace/solverforge-routing"
  icon: "fa-solid fa-route"
  teaser_metric: "1 list variable / OpenStreetMap roads / 15 Hermes tools"
  teaser_copy: "A Hermes plugin that orders your stops on real roads and repairs the trip when your plans change."
  metrics:
    - ["2", "Constraints"]
    - ["1 / 1", "Hard / soft"]
    - ["1", "List variable"]
    - ["2 s", "Default solve budget"]
    - ["15", "Hermes tools"]
    - ["OSM", "Road network"]
  body:
    - "You give Hermes the places, a start, and where the day should end. It searches each place, shows the matches with their type, locality, and distance, and adds nothing until you confirm. The engine builds a road graph from OpenStreetMap with solverforge-maps, and the same graph supplies the travel-time matrix and the geometry of each hop, so the map draws the roads you would drive."
    - "Plans change in the conversation: skip a stop, choose the first visit, add a place, finish somewhere else. The trip is repaired, keeping visited stops, the next visit, and any before rules, and an older solve never overwrites a newer edit. Results are labelled best-found, not proven optimal. The itinerary opens in Google Maps, Apple Maps, or OpenStreetMap, or on your phone through one QR code at a time."
  constraints:
    - ["Every stop once", "The list variable holds each remaining visit exactly once."]
    - ["Drivable hops", "A hop the road graph cannot drive is a hard violation."]
    - ["Next visit", "A visit you lock as next comes right after the start."]
    - ["Before rules", "A stop you want visited before another stays before it."]
    - ["Trip ends", "Back to the start on a round trip, or at the destination you fixed."]
    - ["Driving time", "Soft level: the directed sum of travel seconds on the road matrix."]
  runtime:
    video: "/videos/use-cases/hermes-solverforge-routing-demo.mp4"
    poster: "/images/use-cases/hermes-routing-trip.png"
    label: "SolverForge Routing · 1:28"
    copy: "A day around Cortina d'Ampezzo: six places in a 42.7 km round trip, then skip a stop and visit Vinigo first, and the trip becomes five stops and 44.8 km, ending on the phone handoff."
  home:
    watch: "Watch SolverForge Routing plan a day of driving in Hermes"
    heading: "SolverForge Routing: your stops, in order, on real roads."
    copy: "A Hermes Agent plugin. Hermes finds the places, the solver orders them on OpenStreetMap roads, and the trip is repaired when your plans change."
    cta: "Watch it plan a trip"
  cues:
    - { at: 0, label: "0:00", key: "", text: "A day around Cortina: six places to visit and a hotel to return to." }
    - { at: 10, label: "0:10", key: "", text: "The whole trip goes into one message; Hermes finds each place so you can check the match." }
    - { at: 24, label: "0:24", key: "", text: "With the right places confirmed, you ask for the round trip." }
    - { at: 34, label: "0:34", key: "", text: "The road map opens beside the conversation, the itinerary underneath." }
    - { at: 38, label: "0:38", key: "", text: "Six stops, the roads between them, and about 48 minutes of driving back to the hotel." }
    - { at: 47, label: "0:47", key: "", text: "Plans change: leave out the basilica and go to Vinigo first, without starting over." }
    - { at: 65, label: "1:05", key: "", text: "The repaired trip starts at Vinigo and still ends at the hotel: five stops, 44.8 km." }
    - { at: 77, label: "1:17", key: "", text: "Choose the maps app, scan the code, and take the trip with you." }
    - { at: 84, label: "1:24", key: "", text: "SolverForge Routing, a plugin for Hermes Agent." }
  captures:
    - image: "/images/use-cases/hermes-routing-places.png"
      width: 1600
      height: 900
      badge: "Places"
      alt: "Hermes asking which Darsena is meant, listing three matches with their area and distance from the start, the Navigli basin recommended."
      caption: "An ambiguous place is a question for you, not a guess."
