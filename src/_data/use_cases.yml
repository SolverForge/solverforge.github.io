    heading: "SolverForge Planner: your week, planned by Hermes."
    copy: "A Hermes Agent plugin. Hermes pulls your calendar, the solver fits your tasks around the meetings, and nothing reaches your calendar until you approve it."
    cta: "Watch it plan a week"
  cues:
    - { at: 0, label: "0:00", key: "", text: "One command installs the plugin." }
    - { at: 3, label: "0:03", key: "", text: "Your week is a constraint problem: tasks dropped on top of meetings break hard rules." }
    - { at: 7.5, label: "0:08", key: "", text: "SolverForge moves every task into free time around the meetings." }
    - { at: 12, label: "0:12", key: "", text: "In Hermes Desktop, you ask in plain words for a week planned around your calendar." }
    - { at: 17, label: "0:17", key: "", text: "Hermes pulls the calendar, and SolverForge fits every task around the meetings." }
    - { at: 23, label: "0:23", key: "", text: "The plan card reads 0hard and shows where every task lands: no meeting hit, no deadline missed." }
    - { at: 32, label: "0:32", key: "", text: "Nothing is written until you approve it." }
