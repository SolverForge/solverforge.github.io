# Content for the /use-cases/ showcase page.
#
# Each case renders as one slide of the carousel: a metrics strip, the constraint
# summary, a narrated runtime walkthrough, and annotated screenshots.
#
# Every SolverForge use case is open source, so that is not what distinguishes
# them here: a case with `space_url` gets the Hugging Face Space ribbon, the
# Space link, and is marked runnable in the browser. Callout positions are
# percentages of the 16:9 frame (top, then left) that place the annotation's
# pointer dot, measured against the capture named in `image`.

- id: hospital
  label: "Hospital"
  eyebrow: "Healthcare workforce coverage"
  title: "688 shifts. 50 employees. 28 days of staffed coverage."
  intro: "Hospital scheduling shows scalar assignment at serious density: every shift needs a qualified employee while overlap, rest, availability, preferences, and balance remain visible."
  docs_url: "/docs/getting-started/solverforge-hospital-use-case/"
  space_url: "https://huggingface.co/spaces/SolverForge/solverforge-hospital"
  icon: "fa-solid fa-calendar-days"
  teaser_metric: "688 shifts / 50 employees / 28 days"
  teaser_copy: "Coverage, qualifications, rest, availability, preferences, and fairness across dense workforce schedules."
  metrics:
    - ["688", "Shifts"]
    - ["50", "Employees"]
    - ["28", "Days"]
    - ["9", "Constraints"]
    - ["6 / 3", "Hard / soft split"]
    - ["2", "Schedule views"]
  body:
    - "Coverage planning breaks when qualification, availability, rest, overlap, and fairness are handled by separate tools. A schedule that fills every slot but violates rest or skill rules is not operationally usable."
    - "The current app keeps location schedules, employee schedules, solver status, score analysis, data tables, and REST endpoints available from the same retained job."
  constraints:
    - ["Coverage", "Required shifts must receive staff."]
    - ["Skills", "Employees must satisfy role and qualification requirements."]
    - ["Overlap prevention", "Employees cannot be double-booked across overlapping work."]
    - ["Rest and day limits", "Work sequences respect rest and one-shift-per-day rules."]
    - ["Availability", "Unavailable employees are excluded from assignments."]
    - ["Soft balance", "Preferences and workload balance remain inspectable tradeoffs."]
  runtime:
    video: "/videos/use-cases/solverforge-hospital-demo.mp4"
    poster: "/images/use-cases/hospital-location-schedule.png"
    label: Runtime walkthrough
    copy: "Watch the coverage plan fill, then read the same retained job from the location view, the employee view, and score analysis."
    caption: "Narrated walkthrough (2:29): the location schedule, the employee schedule, solver status, score analysis, the data tables, and the REST surface of one retained hospital solve."
  screenshots:
    - image: "/images/use-cases/hospital-location-schedule.png"
      badge: "Location Schedule"
      alt: "SolverForge Hospital location schedule showing many shifts across departments and days."
      caption: "Location schedules keep coverage pressure visible by department and day."
      callouts:
        - text: "Department rows expose where coverage is required."
          top: 22.0
          left: 6.0
        - text: "Dense shift placement stays visible across the 28-day horizon."
          top: 38.0
          left: 45.0
    - image: "/images/use-cases/hospital-employee-schedule.png"
      badge: "Employee Schedule"
      alt: "SolverForge Hospital employee schedule showing assignments by employee across the planning horizon."
      caption: "Employee schedules reveal whether the same plan works from the worker perspective."
      callouts:
        - text: "Employee rows expose workload and assignment spread."
          top: 29.8
          left: 1.5
        - text: "The same retained job can be inspected by people instead of only by locations."
          top: 41.0
          left: 46.0
    - image: "/images/use-cases/hospital-solver-status.png"
      badge: "Solver Status"
      alt: "SolverForge Hospital solver status surface showing retained-job lifecycle and telemetry controls."
      caption: "Solver status keeps lifecycle and telemetry visible during retained workforce planning."
      callouts:
        - text: "Status controls keep solve lifecycle explicit."
          top: 12.0
          left: 42.0
        - text: "Telemetry remains visible while the schedule is being reviewed."
          top: 51.0
          left: 37.0
    - image: "/images/use-cases/hospital-score-analysis.png"
      badge: "Score Analysis"
      alt: "SolverForge Hospital score analysis modal showing constraint rows, scores, and match counts."
      caption: "Score analysis explains which staffing rules are hard legality and which are soft tradeoffs."
      callouts:
        - text: "Hard staffing legality and soft balance are separated for audit."
          top: 31.0
          left: 38.0
        - text: "Each row exposes contribution and match counts for review."
          top: 58.0
          left: 38.0
    - image: "/images/use-cases/hospital-data.png"
      badge: "Data View"
      alt: "SolverForge Hospital data view showing employees, shifts, locations, skills, and availability tables."
      caption: "Data views keep the facts behind the schedule close to the plan being inspected."
      callouts:
        - text: "Employees, shifts, locations, and availability remain inspectable."
          top: 22.0
          left: 7.0
        - text: "Input facts stay adjacent to the generated schedule surface."
          top: 56.0
          left: 39.0
    - image: "/images/use-cases/hospital-rest-api.png"
      badge: "REST API"
      alt: "SolverForge Hospital REST API tab showing retained-job endpoints for demo data, solve creation, status, snapshots, and analysis."
      caption: "REST endpoints expose the same retained workforce workflow for product integration."
      callouts:
