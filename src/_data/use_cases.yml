  space_url: "https://huggingface.co/spaces/SolverForge/solverforge-deliveries"
  icon: "fa-solid fa-route"
  teaser_metric: "82 deliveries / 10 vehicles / ordered routes"
  teaser_copy: "Route ownership, capacity, time windows, recommendations, and REST workflows on one inspectable surface."
  metrics:
    - ["82", "Deliveries"]
    - ["10", "Vehicles"]
    - ["3", "City datasets"]
    - ["4", "Constraints"]
    - ["3 / 1", "Hard / soft split"]
    - ["Retained", "Job lifecycle"]
  body:
    - "A delivery plan is not just assignment. Vehicle order matters, time windows matter, capacity matters, and changes need repair workflows that preserve useful route structure instead of throwing the plan away."
    - "The current app exposes the route map, vehicle timeline, delivery timeline, recommendations, score analysis, retained snapshots, and REST endpoints as one planning surface."
  constraints:
    - ["Assignment coverage", "Every delivery must belong to exactly one route."]
    - ["Vehicle capacity", "Route load stays within vehicle capacity."]
    - ["Time windows", "Deliveries stay inside the promised service window."]
    - ["Travel time", "Soft pressure keeps total route travel efficient."]
    - ["Route geometry", "Retained snapshots expose the route path and ordered stops."]
