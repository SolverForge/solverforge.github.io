- id: lessons
  label: "Lessons"
  eyebrow: "School timetabling"
  title: "300 lessons. 12 cohorts. 20 teachers. One inspectable school week."
  intro: "Lesson timetabling shows two scalar decisions per lesson: which weekly timeslot and which room. Teacher availability, cohort availability, room capacity, and single-booking rules hold at the same time as soft timetable quality."
  docs_url: "/docs/getting-started/solverforge-lessons-use-case/"
  space_url: "https://huggingface.co/spaces/SolverForge/solverforge-lessons"
  icon: "fa-solid fa-school"
  teaser_metric: "300 lessons / 20 teachers / 10 rooms"
  teaser_copy: "Two scalar decisions per lesson: which weekly timeslot fits the timetable, and which room fits the class."
  metrics:
    - ["300", "Lessons"]
    - ["12", "Cohorts"]
    - ["20", "Teachers"]
    - ["40", "Weekly timeslots"]
    - ["10", "Rooms"]
    - ["11", "Constraints"]
  body:
    - "A timetable is not a table of slots. Every lesson needs a room that fits the class, a teacher who is available at that hour, and a cohort that is not already booked. No teacher can teach two lessons at once, no cohort can be in two places, and no room can host a double booking."
    - "The app keeps the generated week, the retained job, score analysis, the input tables, and the REST surface on one inspectable timetable: cohort, room, and teacher views are three readings of the same retained plan."
  constraints:
    - ["Teacher availability", "Teachers can teach only the timeslots they are available for."]
    - ["Cohort availability", "Student groups can attend only the timeslots they are available for."]
    - ["Room capacity", "An assigned room must have capacity for the class size."]
    - ["Single booking", "One teacher, one cohort, and one room cannot host overlapping lessons."]
    - ["Assignment completeness", "Medium pressure keeps every lesson assigned to both a timeslot and a room."]
    - ["Timetable quality", "Room kind, late-day lessons, and repeated subjects stay visible as soft pressure."]
  runtime:
    video: "/videos/use-cases/solverforge-lessons-demo.mp4"
    poster: "/images/use-cases/lessons-group-timetable.png"
    label: Runtime walkthrough
    copy: "Watch the school week fill cohort by cohort, then check the same 300 lessons from rooms, teachers, and score analysis."
    caption: "Narrated walkthrough (2:02): cohort timetables, room utilization, teacher loads, score analysis, the data tables, and the REST surface of one retained timetable solve."
  screenshots:
    - image: "/images/use-cases/lessons-group-timetable.png"
      badge: "Group timetable"
      alt: "SolverForge Lessons cohort timetable with solved Monday schedules, per-cohort scheduled badges, and the solver status strip."
      caption: "The cohort view lays out each group's week across a fixed Monday-to-Friday teaching week, with the status strip, score, and constraint dots on the same surface."
      callouts:
        - text: "The status strip keeps lifecycle state, score, moves per second, and all 11 constraint dots visible."
          top: 8.4
          left: 14.4
        - text: "Each scheduled lesson carries its room, teacher, and cohort inside the block."
          top: 39.8
          left: 24.4
    - image: "/images/use-cases/lessons-room-utilization.png"
      badge: "Room utilization"
      alt: "SolverForge Lessons room utilization rail showing every room as a lane with its scheduled lesson blocks."
      caption: "Room utilization turns the same retained plan around: every lane is one room, with booked lessons placed against the teaching day."
      callouts:
        - text: "Room lanes show how the building is used across the week."
          top: 40.0
          left: 8.0
        - text: "The same 300 lessons, read from the rooms instead of the cohorts."
          top: 35.2
          left: 48.2
    - image: "/images/use-cases/lessons-teacher-loads.png"
      badge: "Teacher loads"
      alt: "SolverForge Lessons teacher load rail showing each teacher as a lane with scheduled lessons and load badges."
      caption: "Teacher loads expose the working week of every teacher, so a timetable that fits the cohorts can be checked against the people teaching it."
      callouts:
        - text: "Each view is one retained plan; only the grouping changes."
          top: 28.5
          left: 17.5
        - text: "Teacher lanes expose that teacher's own week and load."
          top: 39.8
          left: 32.4
    - image: "/images/use-cases/lessons-score-analysis.png"
      badge: "Score analysis"
      alt: "SolverForge Lessons score analysis modal listing all 11 constraints with type, score, and match counts."
      caption: "Score analysis makes the timetable auditable: hard legality, medium assignment pressure, and soft quality stay separated with match counts."
      callouts:
        - text: "Hard, medium, and soft score components stay separate."
          top: 26.7
          left: 28.3
        - text: "Soft pressure keeps its contribution and match count per constraint."
          top: 50.2
          left: 28.3
    - image: "/images/use-cases/lessons-data.png"
      badge: "Data view"
      alt: "SolverForge Lessons data view showing the lesson table with duration, group, subject, teacher, room kind, and assigned timeslot columns."
      caption: "Data views keep cohorts, subjects, teachers, rooms, and timeslots next to the plan, with the assigned timeslot and room visible per lesson."
      callouts:
        - text: "Input facts stay in the same surface as the generated plan."
          top: 19.6
          left: 2.6
        - text: "Assignment columns show the chosen room and timeslot per lesson."
          top: 17.5
          left: 84.0
    - image: "/images/use-cases/lessons-rest-api.png"
      badge: "REST API"
      alt: "SolverForge Lessons REST API guide listing health, info, demo data, job, snapshot, and analysis endpoints with curl examples."
      caption: "The REST guide exposes the same retained workflow for integration: demo data, solve creation, status, snapshots, analysis, lifecycle actions, and events."
      callouts:
        - text: "Every endpoint ships a copyable curl example."
          top: 23.5
          left: 46.0
        - text: "Retained-job endpoints cover create, status, snapshot, analysis, and events."
          top: 82.1
          left: 1.6

- id: deliveries
  label: "Deliveries"
  eyebrow: "Urban delivery routing"
  title: "82 Philadelphia deliveries. 10 vehicles. Ordered routes you can inspect."
  intro: "Delivery routing proves list-variable planning: each vehicle owns an ordered route while capacity, time windows, travel time, retained snapshots, route geometry, and insertion recommendations stay inspectable."
