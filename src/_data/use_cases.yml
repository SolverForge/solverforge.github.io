      caption: "The cohort view lays out each group's week across a fixed Monday-to-Friday teaching week, with the status strip, score, and constraint dots on the same surface."
      callouts:
        - text: "The status strip keeps lifecycle state, score, moves per second, and all 11 constraint dots visible."
          top: 8.4
          left: 14.4
        - text: "Each scheduled lesson carries its room, teacher, and cohort inside the block."
          top: 39.8
          left: 24.4
    - image: "/images/use-cases/lessons-room-utilization.png"
      badge: "Room utilization"
      alt: "SolverForge Lessons room utilization rail showing every room as a lane with its scheduled lesson blocks."
      caption: "Room utilization turns the same retained plan around: every lane is one room, with booked lessons placed against the teaching day."
      callouts:
        - text: "Room lanes show how the building is used across the week."
          top: 40.0
          left: 8.0
        - text: "The same 300 lessons, read from the rooms instead of the cohorts."
          top: 35.2
          left: 48.2
    - image: "/images/use-cases/lessons-teacher-loads.png"
