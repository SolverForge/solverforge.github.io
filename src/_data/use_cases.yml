# `variant: product` swaps the narrated walkthrough and annotated captures for
# the product's own video, a cue sheet that seeks it, and plain captures of the
# real app; `ribbon` names what kind of product it is on the selector tab, and
# `home` is its band on the home page. Copy describes what the reader sees on
# screen, never how the video was made. Cue times are seconds into the video;
# each label is that time rounded to m:ss. Capture `width`/`height` are the
# image's own pixels, so captures that are not 16:9 keep their shape.
- id: hermes-workbench
  label: "SolverForge Workbench"
  variant: product
  ribbon: "Hermes"
  eyebrow: "Built on SolverForge · Hermes Agent plugin"
  title: "A planning platform inside Hermes: models, data, solves and answers."
  intro: "SolverForge Workbench turns Hermes Agent into a planning platform on your own machine. It ships four planning models with every one of their constraints (employee scheduling, task scheduling, pick-up and delivery routing, field service routing) and hosts any model Hermes builds for you with solverforge-cli. Every model gets the same workflow: datasets you can edit, profiles of weights and settings, background solves, explanations by rule, replanning, experiments and trends, in the chat or on the plugin's own page in Hermes Desktop."
  repo_url: "https://github.com/blackopsrepl/hermes-solverforge-workbench"
  icon: "fa-solid fa-flask"
  teaser_metric: "4 models / 244 constraints / 37 Hermes tools"
  teaser_copy: "Stock models for rosters, schedules and routes, models Hermes builds for you, and one workflow to solve, explain, replan and compare them."
  metrics:
    - ["4", "Stock models"]
    - ["244", "Constraints"]
    - ["4", "Large demos"]
    - ["37", "Hermes tools"]
    - ["OSM", "Road network for routing"]
    - ["Custom", "Models built with solverforge-cli"]
  body:
    - "The platform is the same for every model. A dataset is a model's input: a JSON file you import, a plan Hermes writes from what you tell it, or one of the large demos (a hospital month with 50 employees and 536 shifts, a factory week with 409 operations, two days of Milan patient transport, two days of Turin building services). Every table opens in a grid with a typed editor for each field the model reads, and every change makes a new dataset that remembers its parent. Profiles hold constraint weights and solve settings, and solves run in the background while you keep working, in the chat or on the Desktop page."
    - "A finished run gives a verdict in words, the score per level, the model's own measures, and every constraint with the matches it blames. For anything left unplanned, fill ranks the places it could still go and what each one changes. A replan starts from the current plan and keeps what can stay, experiments rank profiles over the same datasets, and trends chart every solve over time. Plans show as rosters, schedules, assignment boards or maps; the routing models measure travel on OpenStreetMap roads with solverforge-maps. When no stock model fits, Hermes builds one with solverforge-cli, and it joins the platform with the same tools and pages."
  constraints:
    - ["Employee scheduling", "127 constraints: skills, availability, contract limits over periods, rest, rotations, hourly demand, cost and fairness."]
    - ["Field service routing", "64 constraints: skills, time windows and SLAs, breaks, multi-technician visits, coverage areas and shift limits."]
    - ["Pick-up and delivery routing", "36 constraints: stop order, vehicle capacity, time windows and SLAs, breaks, priorities and overtime."]
    - ["Task scheduling", "17 constraints: time windows, dependencies, resource fit, changeovers, due dates, makespan and idle time."]
    - ["Your own models", "A solverforge-cli project, built on your machine and hosted with the same tools and pages."]
    - ["Profiles", "Every constraint's weight and every solve setting, saved per profile and compared in experiments."]
  runtime:
    video: "/videos/use-cases/hermes-solverforge-workbench-demo.mp4"
    poster: "/images/use-cases/hermes-workbench-models.png"
    label: "SolverForge Workbench · 3:14"
    copy: "One tour of the platform: the models page, then a full workflow on one of the demos (Turin field service: data, solve, explanation, fill, a replan after a sick call, two profiles compared, trends), a hospital roster changed from the chat, and a model Hermes built itself."
  home:
    watch: "Watch a tour of SolverForge Workbench in Hermes"
    heading: "SolverForge Workbench: a planning platform inside Hermes."
    copy: "Edit the data, tune the weights and read why every rule fired, in the chat or on the plugin's page in Hermes Desktop."
    cta: "Watch the tour"
  cues:
    - { at: 0, label: "0:00", key: "", text: "Four stock models land one by one with their rule counts, and a fifth you build yourself." }
    - { at: 13.44, label: "0:13", key: "", text: "The models page: every model with its latest plan." }
    - { at: 22.06, label: "0:22", key: "", text: "The workflow, on one demo: two days of building services in Turin, 30 technicians and 223 visits." }
    - { at: 32.7, label: "0:33", key: "", text: "The demo is an ordinary dataset: every table opens and edits in place." }
    - { at: 44.14, label: "0:44", key: "", text: "Solve: after a minute every hard rule holds, and two visits are left over." }
    - { at: 60.05, label: "1:00", key: "", text: "Each technician's day on the map, along the real roads." }
    - { at: 66.72, label: "1:07", key: "", text: "Every rule by name, with what it costs and the matches it blames." }
    - { at: 74.72, label: "1:15", key: "", text: "For a visit left over, every place it could still go, ranked." }
    - { at: 83.29, label: "1:23", key: "", text: "A technician calls in sick: the replan keeps 180 visits where they were and moves 59." }
    - { at: 104.42, label: "1:44", key: "", text: "A profile that weighs travel time higher, saved beside Standard." }
    - { at: 114.73, label: "1:55", key: "", text: "Both profiles on the same plan: shorter drives save four hours of travel but leave more visits open, so Standard ranks first." }
    - { at: 136.41, label: "2:16", key: "", text: "Every solve is kept and charted over time." }
    - { at: 143.91, label: "2:24", key: "", text: "In the chat: Ines can't work on Wednesday, so Hermes gives her shift to Wes, solves the month again and checks every rule." }
    - { at: 166.97, label: "2:47", key: "", text: "A model Hermes built with solverforge-cli opens in the same workbench." }
    - { at: 182.4, label: "3:02", key: "", text: "SolverForge Workbench, a plugin for Hermes Agent." }
