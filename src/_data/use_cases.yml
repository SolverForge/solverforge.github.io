- id: orders
  label: "Order picking"
  eyebrow: "Warehouse order picking"
  title: "8 grocery orders. 145 pick items. 5 trolleys. One inspectable walking plan."
  intro: "Order picking treats warehouse trolley routes as ordered lists: every item, bucket limit, order split, product location, and walking-metre tradeoff stays visible on the plan an operator would actually walk."
